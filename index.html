<!DOCTYPE html><html><head><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></head><body><center><h2>Dynamic QR - 30s</h2><div id="q"></div><h1 id="t">30s</h1><p id="tok"></p></center><script>let s=30,tk="";function qr(){tk="ATT-"+Date.now();document.getElementById("tok").innerText=tk;document.getElementById("q").innerHTML="";new QRCode(document.getElementById("q"),{text:tk,width:220,height:220});s=30}qr();setInterval(()=>{s--;document.getElementById("t").innerText=s+"s";if(s<=0)qr()},1000);</script></body></html>
